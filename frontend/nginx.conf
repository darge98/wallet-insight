server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # L'app usa withHashLocation() per il routing: le rotte client vivono dopo
    # il "#" dell'URL, quindi non serve alcun rewrite try_files per la SPA.
    # Basta servire index.html sulla radice e gli asset statici così come sono.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy verso il backend Spring Boot: stessa origine del frontend, quindi
    # nessun problema di CORS, ed è pronto per quando l'app smetterà di usare
    # l'adapter mock per passare alle API reali.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
