sonar.host.url=https://sonarcloud.io
sonar.organization=darge98
sonar.projectKey=darge98_wallet-insight-frontend
sonar.projectName=Wallet Insights — frontend

sonar.sources=apps,libs
sonar.exclusions=**/*.spec.ts,**/test-setup.ts,**/vite.config.mts,**/eslint.config.mjs
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info

# IsoDate e YearMonth sono alias di string di proposito: nominano il formato del
# contratto HTTP (yyyy-MM-dd, yyyy-MM) dove compare.
sonar.issue.ignore.multicriteria=aliasDocumentati
sonar.issue.ignore.multicriteria.aliasDocumentati.ruleKey=typescript:S6564
sonar.issue.ignore.multicriteria.aliasDocumentati.resourceKey=libs/shared/**/*.ts
