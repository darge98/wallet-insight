name: Dipendenze

# Le vulnerabilità note nelle dipendenze. Una dipendenza ferma diventa vulnerabile
# senza che il codice cambi, per questo il controllo gira anche da solo; se
# fallisce, GitHub lo segnala per mail.
on:
  schedule:
    - cron: '0 6 * * 1' # il lunedì alle 6 UTC
  workflow_dispatch:
  # Una PR che cambia le dipendenze le controlla subito.
  pull_request:
    paths:
      - 'frontend/package-lock.json'
      - 'backend/build.gradle.kts'
      - '.github/workflows/dipendenze.yml'

jobs:
  frontend:
    name: Dipendenze frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Solo ciò che finisce nell'app: gli strumenti di build non arrivano nel browser.
      - run: npm audit --omit=dev --audit-level=high

  backend:
    name: Dipendenze backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # Il database NVD pesa centinaia di MB: dal secondo giro si aggiorna soltanto.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - run: ./gradlew dependencyCheckAnalyze --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: backend/build/reports/dependency-check-report.html
