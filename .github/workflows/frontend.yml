name: Frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

# Un nuovo push sullo stesso ramo rende inutile l'esecuzione precedente.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar legge la storia per attribuire i problemi al codice nuovo.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Lo stesso `npm run verify` dello sviluppo (lint, test, build), spezzato
      # in passi per vedere subito quale ha fallito.
      - run: npm run lint
      - run: npx nx run-many -t test --coverage
      - run: npm run build
      # Ogni libreria scrive l'lcov coi percorsi relativi a sé: Sonar li vuole
      # relativi a frontend/, e la cartella del report è quella della libreria.
      - name: Percorsi della coverage
        run: |
          find coverage -name lcov.info | while read -r f; do
            dir=${f#coverage/}; dir=${dir%/lcov.info}
            sed -i "s|^SF:|SF:$dir/|" "$f"
          done
      # Le PR da fork e di Dependabot non vedono i secret: lì l'analisi si salta.
      - uses: SonarSource/sonarqube-scan-action@v8
        if: env.SONAR_TOKEN != ''
        with:
          projectBaseDir: frontend
